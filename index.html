<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satisfactory Calculator</title>
<style>
:root {
  --bg: #0f1117;
  --surf: #181b24;
  --surf2: #1f2430;
  --surf3: #252a38;
  --border: #2a2f42;
  --border2: #3a4055;
  --accent: #f5a623;
  --accent-dim: #c48018;
  --accent-glow: rgba(245,166,35,0.1);
  --text: #e2e6f0;
  --dim: #8b90a0;
  --muted: #454a5e;
  --green: #4ade80;
  --blue: #60a5fa;
  --red: #f87171;
  --yellow: #fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  height:100vh;overflow:hidden;
  display:grid;
  grid-template-rows:54px 1fr;
  grid-template-columns:230px 1fr 370px;
  grid-template-areas:"hdr hdr hdr" "side plan res";
}
/* ── Header ── */
#hdr{
  grid-area:hdr;background:var(--surf);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 16px;
}
.logo{font-size:17px;font-weight:700;color:var(--accent);letter-spacing:.4px;white-space:nowrap}
.logo span{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
.vr{width:1px;height:22px;background:var(--border)}
.mode-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.mode-btn{
  padding:5px 14px;font-size:12px;font-weight:500;
  cursor:pointer;border:none;background:transparent;color:var(--dim);transition:all .15s;
}
.mode-btn.on{background:var(--accent);color:#0f1117;font-weight:700}
.mode-btn:hover:not(.on){background:var(--surf2);color:var(--text)}
.cost-mult{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.cost-mult select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;outline:none;cursor:pointer}
.cost-mult select:focus{border-color:var(--accent)}
.hdr-ver{font-size:11px;color:var(--muted);white-space:nowrap}
/* ── Sidebar ── */
#side{
  grid-area:side;background:var(--surf);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-hdr{padding:10px;border-bottom:1px solid var(--border)}
.side-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:7px}
.search{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:6px 9px;color:var(--text);font-size:12px;outline:none;
}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--muted)}
#item-list{flex:1;overflow-y:auto;padding:3px 0}
#item-list::-webkit-scrollbar{width:4px}
#item-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.grp-lbl{
  padding:5px 10px 2px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
}
.item-row{
  padding:4px 10px;font-size:12px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .1s;
}
.item-row:hover{background:var(--surf2)}
.item-row.sel{background:var(--accent-glow);color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.c-raw{background:#6b7280}.c-ingot{background:#f59e0b}.c-basic{background:#3b82f6}
.c-standard{background:#8b5cf6}.c-industrial{background:#ec4899}
.c-petroleum{background:#14b8a6}.c-liquid{background:#06b6d4}
.c-gas{background:#a3e635}.c-nuclear{background:#22c55e}
#item-detail{
  border-top:1px solid var(--border);padding:10px;
  max-height:260px;overflow-y:auto;background:var(--bg);display:none;
}
#item-detail::-webkit-scrollbar{width:4px}
#item-detail::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.det-name{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
.det-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:8px 0 4px}
.rcard{
  background:var(--surf);border:1px solid var(--border);border-radius:4px;
  padding:7px 8px;margin-bottom:5px;font-size:11px;
}
.rcard.alt{border-color:var(--accent-dim)}
.rcard-name{font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.alt-badge{
  font-size:9px;background:var(--accent);color:#0f1117;
  padding:1px 4px;border-radius:2px;font-weight:800;
}
.rcard-machine{
  display:inline-block;font-size:10px;color:var(--dim);
  background:var(--surf2);padding:1px 5px;border-radius:2px;margin-bottom:3px;
}
.rcard-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:2px;font-size:11px}
.rcard-arrow{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:2px}
.chip-n{color:var(--accent);font-weight:700}
.chip-byp{opacity:.6}
/* ── Planner ── */
#plan{grid-area:plan;display:flex;flex-direction:column;overflow:hidden}
.plan-bar{
  padding:10px 14px;border-bottom:1px solid var(--border);
  background:var(--surf);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.isel{
  flex:1;min-width:170px;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:6px 9px;color:var(--text);font-size:13px;
  outline:none;cursor:pointer;appearance:none;
}
.isel:focus{border-color:var(--accent)}
.ninput{
  width:80px;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:6px 9px;color:var(--text);font-size:13px;
  text-align:right;outline:none;
}
.ninput:focus{border-color:var(--accent)}
.unit{font-size:12px;color:var(--dim);white-space:nowrap}
.go-btn{
  background:var(--accent);color:#0f1117;border:none;border-radius:4px;
  padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;
}
.go-btn:hover{background:#e8961a}
/* Tree */
#tree{flex:1;overflow-y:auto;padding:14px}
#tree::-webkit-scrollbar{width:6px}
#tree::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-ico{font-size:38px;margin-bottom:10px}
.empty-ttl{font-size:15px;font-weight:500;color:var(--dim);margin-bottom:5px}
.empty-sub{font-size:12px}
.tnode{margin-bottom:6px}
.thead{
  display:flex;align-items:center;gap:7px;
  padding:7px 11px;background:var(--surf);
  border:1px solid var(--border);border-radius:5px;
}
.thead.raw-node{background:var(--bg);opacity:.75}
.tname{font-weight:500;font-size:13px;flex:1}
.trate{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.tmach{font-size:11px;color:var(--dim);white-space:nowrap}
.tpow{font-size:11px;color:var(--blue);white-space:nowrap}
.raw-tag{font-size:10px;background:var(--surf3);color:var(--muted);padding:1px 5px;border-radius:2px}
.trsel{
  font-size:11px;background:var(--bg);border:1px solid var(--border);
  border-radius:3px;padding:2px 4px;color:var(--text);outline:none;cursor:pointer;max-width:140px;
}
.trsel:focus{border-color:var(--accent)}
.tchildren{margin-left:20px;margin-top:4px;padding-left:11px;border-left:1px solid var(--border)}
/* Machine Builder */
.mach-list{display:flex;flex-direction:column;gap:7px}
.mrow{
  display:flex;align-items:center;gap:7px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:5px;padding:8px 10px;
}
.msel{
  background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:5px 7px;color:var(--text);font-size:12px;outline:none;
}
.msel:focus{border-color:var(--accent)}
.mcount{
  width:56px;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:5px 7px;color:var(--text);font-size:12px;text-align:center;outline:none;
}
.mcount:focus{border-color:var(--accent)}
.mlbl{font-size:12px;color:var(--dim);white-space:nowrap}
.mrem{
  margin-left:auto;background:transparent;border:1px solid var(--border);
  border-radius:3px;color:var(--muted);padding:3px 7px;cursor:pointer;font-size:12px;transition:all .15s;
}
.mrem:hover{border-color:var(--red);color:var(--red)}
.add-row{
  background:transparent;border:1px dashed var(--border);border-radius:5px;
  color:var(--dim);padding:8px;cursor:pointer;font-size:13px;
  transition:all .15s;text-align:center;width:100%;
}
.add-row:hover{border-color:var(--accent);color:var(--accent)}
/* Multi-factory */
.factory-block{
  border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:6px;padding:12px;margin-bottom:12px;background:var(--surf2);
}
.factory-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.factory-name-input{
  flex:1;background:transparent;border:none;border-bottom:1px solid transparent;
  color:var(--accent);font-size:13px;font-weight:700;padding:2px 4px;outline:none;
  transition:border-color .15s;
}
.factory-name-input:hover{border-bottom-color:var(--border)}
.factory-name-input:focus{border-bottom-color:var(--accent)}
.factory-toggle{
  background:transparent;border:none;color:var(--dim);cursor:pointer;
  font-size:11px;padding:2px 4px;transition:color .15s;flex-shrink:0;
}
.factory-toggle:hover{color:var(--text)}
.factory-light{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 5px currentColor;transition:background .2s,color .2s;
}
.factory-light.green{background:var(--green);color:var(--green)}
.factory-light.red{background:var(--red);color:var(--red)}
.factory-light.dim{background:var(--muted);color:var(--muted);box-shadow:none}
.factory-dup,.factory-rem{
  background:transparent;border:1px solid var(--border);border-radius:3px;
  color:var(--muted);padding:3px 8px;cursor:pointer;font-size:11px;transition:all .15s;
}
.factory-dup:hover{border-color:var(--accent);color:var(--accent)}
.factory-rem:hover{border-color:var(--red);color:var(--red)}
.add-factory-btn{
  background:transparent;border:2px dashed var(--accent);border-radius:6px;
  color:var(--accent);padding:10px;cursor:pointer;font-size:13px;font-weight:600;
  transition:all .15s;text-align:center;width:100%;opacity:.7;
}
.add-factory-btn:hover{opacity:1;background:color-mix(in srgb,var(--accent) 8%,transparent)}
/* Factory section headers in results */
.factory-rsec{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--accent);margin:16px 0 0;padding:5px 8px;
  background:color-mix(in srgb,var(--accent) 10%,transparent);
  border-radius:4px;border-left:3px solid var(--accent);
  display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  transition:background .15s;
}
.factory-rsec:first-child{margin-top:0}
.factory-rsec:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.factory-rsec.aggregate{
  color:var(--text);background:var(--surf2);border-color:var(--border);
  margin-top:20px;
}
.factory-rsec.aggregate:hover{background:var(--surf3)}
.factory-rsec-arrow{font-size:9px;flex-shrink:0}
.factory-rsec-body{margin-bottom:8px}
/* ── Results ── */
#res{
  grid-area:res;background:var(--surf);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.res-hdr{
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
}
#res-body{flex:1;overflow-y:auto;padding:10px}
#res-body::-webkit-scrollbar{width:4px}
#res-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.rsec-ttl{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:6px;
}
.rsec-ttl::after{content:'';flex:1;height:1px;background:var(--border)}
.rsec-ttl:first-child{margin-top:0}
.rrow{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 7px;border-radius:4px;font-size:12px;transition:background .1s;
}
.rrow:hover{background:var(--surf2)}
.rrow-name{display:flex;align-items:center;gap:6px}
.rrow-val{font-family:'Consolas','Courier New',monospace;font-size:12px;font-weight:700}
.col-o{color:var(--accent)}.col-b{color:var(--blue)}.col-g{color:var(--green)}
.col-r{color:var(--red)}.col-d{color:var(--dim)}
.pow-box{
  padding:10px;background:var(--bg);border:1px solid var(--border);
  border-radius:5px;display:flex;align-items:center;justify-content:space-between;
  margin-top:4px;
}
.pow-lbl{font-size:12px;color:var(--dim)}
.pow-val{font-size:20px;font-weight:800;color:var(--blue);font-family:'Consolas',monospace}
.mach-blk{
  padding:6px 8px;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;margin-bottom:4px;font-size:12px;
}
.mach-blk-name{font-weight:600}
.mach-blk-detail{color:var(--dim);font-size:11px;margin-top:1px}
.surplus{color:var(--green)}.deficit{color:var(--red)}.balanced{color:var(--muted)}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">Satisfactory Calculator</div>
  <div class="vr"></div>
  <div class="mode-toggle">
    <button class="mode-btn on" data-mode="target" onclick="setMode('target')">⚙ Target Output</button>
    <button class="mode-btn" data-mode="builder" onclick="setMode('builder')">🏭 Machine Builder</button>
  </div>
  <label class="cost-mult">Recipe cost
    <select id="cost-mult" onchange="setCostMult(this.value)">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1× (default)</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
  </label>
  <div class="hdr-ver">Calc version 1.1.0-alpha for Satisfactory v1.2</div>
</div>

<div id="side">
  <div class="side-hdr">
    <div class="side-label">Recipe Browser</div>
    <input class="search" id="browser-search" placeholder="Search items…" oninput="filterBrowser(this.value)">
  </div>
  <div id="item-list"></div>
  <div id="item-detail"></div>
</div>

<div id="plan">
  <div class="plan-bar" id="plan-bar"></div>
  <div id="tree"></div>
</div>

<div id="res">
  <div class="res-hdr">Production Summary</div>
  <div id="res-body"></div>
</div>

//  INITIALISE LOOKUP MAPS
// ════════════════════════════════════════════════════════
let IMAP={}, RMAP={}, BY_OUT={}, BY_IN={}, DEF_REC={}, BMAP={}, BY_BLDG={};

function initData(){
  // Deduplicate items by id
  const seen=new Set();
  for(const it of ITEMS){
    if(seen.has(it.id)) continue;
    seen.add(it.id);
    IMAP[it.id]=it;
  }
  for(const b of BUILDINGS){ BMAP[b.id]=b; BY_BLDG[b.id]=[]; }
  for(const r of RECIPES){
    RMAP[r.id]=r;
    for(const o of r.outputs){
      if(!BY_OUT[o.item]) BY_OUT[o.item]=[];
      BY_OUT[o.item].push(r);
    }
    for(const inp of r.inputs){
      if(!BY_IN[inp.item]) BY_IN[inp.item]=[];
      BY_IN[inp.item].push(r);
    }
    if(!BY_BLDG[r.machine]) BY_BLDG[r.machine]=[];
    BY_BLDG[r.machine].push(r);
  }
  // Default recipe: first non-alternate per output item
  for(const itemId in BY_OUT){
    const std=BY_OUT[itemId].filter(r=>!r.isAlternate);
    DEF_REC[itemId]=(std.length>0?std[0]:BY_OUT[itemId][0]).id;
  }
}

//  FORMATTING
// ════════════════════════════════════════════════════════
function fmt(n){
  if(n===0) return '0';
  const a=Math.abs(n);
  if(a>=10000) return n.toFixed(0);
  if(a>=1000)  return n.toFixed(1);
  if(a>=100)   return n.toFixed(2);
  if(a>=10)    return n.toFixed(3).replace(/\.?0+$/,'');
  return n.toFixed(4).replace(/\.?0+$/,'');
}
function fmtM(n){
  // machine count: exact + ceiling in parens if not whole
  const c=Math.ceil(n-1e-9);
  const exact=fmt(n);
  if(Math.abs(n-c)<1e-6) return `×${exact}`;
  return `×${exact} <span style="color:var(--yellow)">(need ${c})</span>`;
}

//  CALCULATION — MODE 1 (chain resolver)
// ════════════════════════════════════════════════════════
// Recipe parts cost multiplier (Satisfactory 1.2): scales each ingredient's
// per-craft amount, rounded to nearest whole number, floored at 1. Outputs are
// left unchanged. At the default 1× the amount is returned untouched.
function adjIn(amount){
  if(S.costMult===1) return amount;
  return Math.max(1, Math.round(amount*S.costMult));
}

function resolveChain(itemId, rate, overrides, depth=0){
  const item=IMAP[itemId];
  if(!item||depth>30) return {type:'raw',itemId,rate,item:item||{id:itemId,name:itemId}};
  if(item.isRaw) return {type:'raw',itemId,rate,item};

  const recipeId=overrides[itemId]||DEF_REC[itemId];
  if(!recipeId) return {type:'raw',itemId,rate,item};

  const recipe=RMAP[recipeId];
  const out=recipe.outputs.find(o=>o.item===itemId);
  const outRatePerMach=(out.amount*60)/recipe.duration;
  const machCount=rate/outRatePerMach;
  const bldg=BMAP[recipe.machine];

  const node={
    type:'production', itemId, rate, recipe, machCount,
    power:machCount*(bldg?bldg.power:0),
    item, bldg, children:[],
  };

  for(const inp of recipe.inputs){
    const inpRate=(adjIn(inp.amount)*60)/recipe.duration*machCount;
    node.children.push(resolveChain(inp.item,inpRate,overrides,depth+1));
  }
  return node;
}

function flattenChain(node, acc={mach:{},raw:{},power:0,byproducts:{}}){
  if(node.type==='raw'){
    acc.raw[node.itemId]=(acc.raw[node.itemId]||0)+node.rate;
    return acc;
  }
  // Aggregate machine usage by recipe
  const key=node.recipe.id;
  if(!acc.mach[key]){
    acc.mach[key]={recipe:node.recipe,bldg:node.bldg,count:0,power:0};
  }
  acc.mach[key].count+=node.machCount;
  acc.mach[key].power+=node.power;
  acc.power+=node.power;
  // Secondary outputs (byproducts)
  for(const o of node.recipe.outputs){
    if(o.item===node.itemId) continue;
    const byRate=(o.amount*60)/node.recipe.duration*node.machCount;
    acc.byproducts[o.item]=(acc.byproducts[o.item]||0)+byRate;
  }
  for(const ch of node.children) flattenChain(ch,acc);
  return acc;
}

// ════════════════════════════════════════════════════════
//  CALCULATION — MODE 2 (machine builder)
// ════════════════════════════════════════════════════════
function calcBuilder(machines){
  const out={}, inp={};
  let consumed=0, generated=0;
  for(const m of machines){
    const r=RMAP[m.recipeId]; const b=BMAP[m.buildingId];
    if(!r||!b) continue;
    if(b.generates) generated+=m.count*b.generates;
    else consumed+=m.count*(b.power||0);
    for(const o of r.outputs){ const rt=(o.amount*60)/r.duration*m.count; out[o.item]=(out[o.item]||0)+rt; }
    for(const i of r.inputs){  const rt=(adjIn(i.amount)*60)/r.duration*m.count; inp[i.item]=(inp[i.item]||0)+rt; }
  }
  const all=new Set([...Object.keys(out),...Object.keys(inp)]);
  const net={};
  for(const id of all) net[id]=(out[id]||0)-(inp[id]||0);
  return {out,inp,net,consumed,generated};
}
function allMachines(){ return S.factories.flatMap(f=>f.machines); }

//  RENDER — BROWSER
// ════════════════════════════════════════════════════════
const CAT_ORDER=['raw','ingot','basic','standard','industrial','petroleum','liquid','gas','nuclear'];
const CAT_LABELS={raw:'Raw Resources',ingot:'Ingots',basic:'Basic Parts',standard:'Standard Parts',
  industrial:'Industrial Parts',petroleum:'Petroleum',liquid:'Liquids & Solutions',gas:'Gas',nuclear:'Nuclear'};

function renderBrowser(){
  const q=S.filter.toLowerCase();
  const list=document.getElementById('item-list');
  const groups={};
  const allItems=Object.values(IMAP);
  for(const it of allItems){
    if(q&&!it.name.toLowerCase().includes(q)) continue;
    if(!groups[it.cat]) groups[it.cat]=[];
    groups[it.cat].push(it);
  }
  let html='';
  for(const cat of CAT_ORDER){
    const grp=groups[cat];
    if(!grp||!grp.length) continue;
    html+=`<div class="grp-lbl">${CAT_LABELS[cat]||cat}</div>`;
    grp.sort((a,b)=>a.name.localeCompare(b.name));
    for(const it of grp){
      const sel=S.browserItem===it.id?' sel':'';
      html+=`<div class="item-row${sel}" onclick="selectBrowserItem('${it.id}')">
        <span class="dot c-${it.cat}"></span>${esc(it.name)}</div>`;
    }
  }
  list.innerHTML=html||'<div style="padding:12px;color:var(--muted);font-size:12px">No items found</div>';
  renderBrowserDetail();
}

function renderBrowserDetail(){
  const el=document.getElementById('item-detail');
  if(!S.browserItem){el.style.display='none';return;}
  const item=IMAP[S.browserItem];
  if(!item){el.style.display='none';return;}
  el.style.display='block';

  const produces=(BY_OUT[item.id]||[]);
  const consumes=(BY_IN[item.id]||[]);

  let h=`<div class="det-name">${esc(item.name)}</div>`;
  if(item.isRaw){
    h+=`<div style="font-size:11px;color:var(--muted)">Raw resource — extracted from the world.</div>`;
  }
  if(produces.length){
    h+=`<div class="det-sec">Produced by</div>`;
    for(const r of produces) h+=recipeCardHTML(r,item.id);
  }
  if(consumes.length){
    h+=`<div class="det-sec">Used in</div>`;
    for(const r of consumes) h+=recipeCardHTML(r,null);
  }
  el.innerHTML=h;
}

function recipeCardHTML(r, highlightItem){
  const bldg=BMAP[r.machine];
  let io_html='';
  const inp=r.inputs.map(i=>`<span class="chip"><span class="chip-n">${fmt((i.amount*60)/r.duration)}</span>/min ${esc(IMAP[i.item]?.name||i.item)}</span>`).join('<span style="color:var(--muted);margin:0 2px">+</span>');
  const out=r.outputs.map((o,idx)=>`<span class="chip${idx>0?' chip-byp':''}"><span class="chip-n">${fmt((o.amount*60)/r.duration)}</span>/min ${esc(IMAP[o.item]?.name||o.item)}</span>`).join('<span style="color:var(--muted);margin:0 2px">+</span>');
  return `<div class="rcard${r.isAlternate?' alt':''}">
    <div class="rcard-name">${r.isAlternate?'<span class="alt-badge">ALT</span>':''}${esc(r.name)}</div>
    <span class="rcard-machine">${bldg?bldg.name:r.machine}</span>
    <div class="rcard-row">${inp}<span class="rcard-arrow">→</span>${out}</div>
  </div>`;
}

function renderPlannerBar(){
  const bar=document.getElementById('plan-bar');
  if(S.mode==='target'){
    // Sorted item list (items that have recipes)
    const itemsWithRecipes=Object.keys(DEF_REC).map(id=>IMAP[id]).filter(Boolean)
      .sort((a,b)=>a.name.localeCompare(b.name));
    const opts=itemsWithRecipes.map(it=>
      `<option value="${it.id}"${it.id===S.targetItem?' selected':''}>${esc(it.name)}</option>`
    ).join('');
    bar.innerHTML=`
      <select class="isel" id="target-item" onchange="S.targetItem=this.value">
        <option value="">— Select item to produce —</option>${opts}
      </select>
      <input class="ninput" id="target-rate" type="number" min="0.001" step="any"
             value="${S.targetRate}" onchange="S.targetRate=+this.value||1">
      <span class="unit">/min</span>
      <button class="go-btn" onclick="doCalculate()">Calculate</button>`;
  } else {
    bar.innerHTML=`<div style="font-size:12px;color:var(--dim)">Add machines below — outputs and inputs update automatically.</div>`;
  }
}

// ════════════════════════════════════════════════════════
//  RENDER — PRODUCTION TREE (Mode 1)
// ════════════════════════════════════════════════════════
function renderTree(){
  const el=document.getElementById('tree');
  if(S.mode==='target'){
    if(!S.chain){
      el.innerHTML=`<div class="empty">
        <div class="empty-ico">⚙️</div>
        <div class="empty-ttl">Select an item and target rate</div>
        <div class="empty-sub">then click Calculate to see the full production chain</div>
      </div>`; return;
    }
    el.innerHTML=nodeHTML(S.chain);
  } else {
    renderBuilder(el);
  }
}

function nodeHTML(node){
  if(node.type==='raw'){
    return `<div class="tnode">
      <div class="thead raw-node">
        <span class="tname">${esc(node.item.name)}</span>
        <span class="trate">${fmt(node.rate)}/min</span>
        <span class="raw-tag">RAW</span>
      </div>
    </div>`;
  }
  const recipes=BY_OUT[node.itemId]||[];
  let rsel='';
  if(recipes.length>1){
    const opts=recipes.map(r=>`<option value="${r.id}"${r.id===node.recipe.id?' selected':''}>${r.isAlternate?'★ ':''}${esc(r.name)}</option>`).join('');
    rsel=`<select class="trsel" onclick="event.stopPropagation()"
      onchange="setOverride('${esc(node.itemId)}',this.value)">${opts}</select>`;
  }
  const children=node.children.map(c=>nodeHTML(c)).join('');
  return `<div class="tnode">
    <div class="thead">
      <span class="tname">${esc(node.item.name)}</span>
      ${rsel}
      <span class="trate">${fmt(node.rate)}/min</span>
      <span class="tmach">${fmtM(node.machCount)} ${esc(node.bldg?node.bldg.name:node.recipe.machine)}</span>
      <span class="tpow">⚡${fmt(node.power)} MW</span>
    </div>
    ${children?`<div class="tchildren">${children}</div>`:''}
  </div>`;
}

// ════════════════════════════════════════════════════════
//  RENDER — MACHINE BUILDER (Mode 2)
// ════════════════════════════════════════════════════════
function machineRowHTML(fid, m){
  const bldgOpts=BUILDINGS.map(b=>
    `<option value="${b.id}"${b.id===m.buildingId?' selected':''}>${esc(b.name)}</option>`
  ).join('');
  const recs=BY_BLDG[m.buildingId]||[];
  const recOpts=recs.map(r=>
    `<option value="${r.id}"${r.id===m.recipeId?' selected':''}>${r.isAlternate?'★ ':''}${esc(r.name)}</option>`
  ).join('');
  return `<div class="mrow">
    <select class="msel" onchange="setBuildingId(${fid},${m.id},this.value)">
      <option value="">— Building —</option>${bldgOpts}
    </select>
    <select class="msel" onchange="setMRecipe(${fid},${m.id},this.value)" style="flex:1;min-width:0">
      <option value="">— Recipe —</option>${recOpts}
    </select>
    <span class="mlbl">×</span>
    <input class="mcount" type="number" min="0" step="1" value="${m.count}"
           onchange="setMCount(${fid},${m.id},+this.value)">
    <button class="mrem" onclick="removeMachine(${fid},${m.id})">✕</button>
  </div>`;
}

function renderBuilder(el){
  const canRemove=S.factories.length>1;
  let html=`<div style="padding:14px">`;
  for(const f of S.factories){
    const collapsed=S.collapsed.has(f.id);
    // Status light: dim if no machines, red if any deficit, green otherwise
    let lightCls='dim';
    if(f.machines.length){
      const {net}=calcBuilder(f.machines);
      const hasDeficit=Object.values(net).some(n=>n<-0.001);
      lightCls=hasDeficit?'red':'green';
    }
    html+=`<div class="factory-block">
      <div class="factory-hdr">
        <button class="factory-toggle" onclick="toggleFactory(${f.id})">${collapsed?'▶':'▼'}</button>
        <span class="factory-light ${lightCls}" data-fid="${f.id}"></span>
        <input class="factory-name-input" value="${esc(f.name)}"
               onchange="renameFactory(${f.id},this.value)"
               onblur="renameFactory(${f.id},this.value)">
        <button class="factory-dup" onclick="duplicateFactory(${f.id})" title="Duplicate factory">⧉</button>
        ${canRemove?`<button class="factory-rem" onclick="removeFactory(${f.id})">✕</button>`:''}
      </div>`;
    if(!collapsed){
      html+=`<div class="mach-list">`;
      for(const m of f.machines) html+=machineRowHTML(f.id,m);
      html+=`</div>
      <button class="add-row" style="margin-top:8px" onclick="addMachine(${f.id})">+ Add Machine</button>`;
    }
    html+=`</div>`;
  }
  html+=`<button class="add-factory-btn" onclick="addFactory()">+ Add Factory</button>
  </div>`;
  el.innerHTML=html;
}

// ════════════════════════════════════════════════════════
//  RENDER — RESULTS PANEL
// ════════════════════════════════════════════════════════
function renderResults(){
  const el=document.getElementById('res-body');
  if(S.mode==='target'){
    if(!S.chain){el.innerHTML='<div style="padding:16px;color:var(--muted);font-size:12px">Nothing calculated yet.</div>';return;}
    const {mach,raw,power,byproducts}=flattenChain(S.chain);
    let h='';

    // Machines section
    h+=`<div class="rsec-ttl">Machines</div>`;
    const machArr=Object.values(mach).sort((a,b)=>(b.count*b.bldg.power)-(a.count*a.bldg.power));
    for(const m of machArr){
      const ceil=Math.ceil(m.count-1e-9);
      const bname=m.bldg?m.bldg.name:m.recipe.machine;
      h+=`<div class="mach-blk">
        <div class="mach-blk-name"><span style="color:var(--accent)">${ceil}×</span> ${esc(bname)}</div>
        <div class="mach-blk-detail">${esc(m.recipe.name)} · ${fmt(m.count)} exact · ⚡${fmt(m.power)} MW</div>
      </div>`;
    }

    // Byproducts
    const bpArr=Object.entries(byproducts).filter(([,v])=>v>0.001);
    if(bpArr.length){
      h+=`<div class="rsec-ttl">Byproducts</div>`;
      for(const [id,rate] of bpArr){
        const item=IMAP[id];
        h+=`<div class="rrow"><span class="rrow-name"><span class="dot c-${item?.cat||'raw'}"></span>${esc(item?.name||id)}</span>
          <span class="rrow-val col-g">+${fmt(rate)}<span class="col-d">/min</span></span></div>`;
      }
    }

    // Raw resources
    h+=`<div class="rsec-ttl">Raw Resources Needed</div>`;
    const rawArr=Object.entries(raw).sort((a,b)=>b[1]-a[1]);
    for(const [id,rate] of rawArr){
      const item=IMAP[id];
      h+=`<div class="rrow"><span class="rrow-name"><span class="dot c-${item?.cat||'raw'}"></span>${esc(item?.name||id)}</span>
        <span class="rrow-val col-o">${fmt(rate)}<span class="col-d">/min</span></span></div>`;
    }

    // Power
    h+=`<div class="rsec-ttl">Power</div>
      <div class="pow-box"><span class="pow-lbl">Total draw</span><span class="pow-val">${fmt(power)} <span style="font-size:14px;font-weight:400;color:var(--dim)">MW</span></span></div>`;
    el.innerHTML=h;

  } else {
    // Mode 2
    const total=allMachines();
    if(!total.length){el.innerHTML='<div style="padding:16px;color:var(--muted);font-size:12px">Add machines to see results.</div>';return;}
    const multi=S.factories.length>1;
    let h='';
    for(const f of S.factories){
      if(!f.machines.length) continue;
      const {net}=calcBuilder(f.machines);
      const hasDeficit=Object.values(net).some(n=>n<-0.001);
      const lightCls=hasDeficit?'red':'green';
      const collapsed=S.resCollapsed.has(f.id);
      if(multi){
        h+=`<div class="factory-rsec" onclick="toggleResFactory(${f.id})">
          <span class="factory-rsec-arrow">${collapsed?'▶':'▼'}</span>
          <span class="factory-light ${lightCls}" style="margin:0"></span>
          <span>${esc(f.name)}</span>
        </div>`;
      }
      if(!collapsed) h+=`<div class="factory-rsec-body">${builderResultsHTML(f.machines)}</div>`;
    }
    if(multi){
      const allCollapsed=S.resCollapsed.has('all');
      h+=`<div class="factory-rsec aggregate" onclick="toggleResFactory('all')">
        <span class="factory-rsec-arrow">${allCollapsed?'▶':'▼'}</span>
        <span>All Factories</span>
      </div>`;
      if(!allCollapsed) h+=`<div class="factory-rsec-body">${builderResultsHTML(total)}</div>`;
    }
    el.innerHTML=h;
  }
}

function builderResultsHTML(machines){
  const {out,inp,net,consumed,generated}=calcBuilder(machines);
  let h='';
  const surplus=[],deficit=[],balanced=[];
  for(const [id,n] of Object.entries(net)){
    if(n>0.001) surplus.push([id,n]);
    else if(n<-0.001) deficit.push([id,-n]);
    else balanced.push(id);
  }
  surplus.sort((a,b)=>b[1]-a[1]);
  deficit.sort((a,b)=>b[1]-a[1]);
  if(surplus.length){
    h+=`<div class="rsec-ttl">Outputs (surplus)</div>`;
    for(const [id,rate] of surplus){
      const item=IMAP[id];
      h+=`<div class="rrow"><span class="rrow-name"><span class="dot c-${item?.cat||'raw'}"></span>${esc(item?.name||id)}</span>
        <span class="rrow-val surplus">+${fmt(rate)}<span class="col-d">/min</span></span></div>`;
    }
  }
  if(deficit.length){
    h+=`<div class="rsec-ttl">Inputs needed</div>`;
    for(const [id,rate] of deficit){
      const item=IMAP[id];
      h+=`<div class="rrow"><span class="rrow-name"><span class="dot c-${item?.cat||'raw'}"></span>${esc(item?.name||id)}</span>
        <span class="rrow-val deficit">−${fmt(rate)}<span class="col-d">/min</span></span></div>`;
    }
  }
  if(balanced.length){
    h+=`<div class="rsec-ttl">Balanced internally</div>`;
    for(const id of balanced){
      const item=IMAP[id];
      h+=`<div class="rrow"><span class="rrow-name"><span class="dot c-${item?.cat||'raw'}"></span>${esc(item?.name||id)}</span>
        <span class="rrow-val balanced">✓</span></div>`;
    }
  }
  const netPow=generated-consumed;
  h+=`<div class="rsec-ttl">Power</div>`;
  if(consumed)  h+=`<div class="pow-box"><span class="pow-lbl">Consumed</span><span class="pow-val deficit">${fmt(consumed)} <span style="font-size:14px;font-weight:400;color:var(--dim)">MW</span></span></div>`;
  if(generated) h+=`<div class="pow-box"><span class="pow-lbl">Generated</span><span class="pow-val surplus">${fmt(generated)} <span style="font-size:14px;font-weight:400;color:var(--dim)">MW</span></span></div>`;
  if(consumed&&generated){
    const cls=netPow>=0?'surplus':'deficit';
    const sign=netPow>=0?'+':'−';
    h+=`<div class="pow-box"><span class="pow-lbl">Net</span><span class="pow-val ${cls}">${sign}${fmt(Math.abs(netPow))} <span style="font-size:14px;font-weight:400;color:var(--dim)">MW</span></span></div>`;
  }
  if(!consumed&&!generated) h+=`<div class="pow-box"><span class="pow-lbl">Total draw</span><span class="pow-val">0 <span style="font-size:14px;font-weight:400;color:var(--dim)">MW</span></span></div>`;
  return h;
}

// ════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ════════════════════════════════════════════════════════
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setMode(mode){
  S.mode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  renderPlannerBar();
  renderTree();
  renderResults();
}

function setCostMult(v){
  S.costMult=parseFloat(v)||1;
  if(S.mode==='target'&&S.targetItem) S.chain=resolveChain(S.targetItem,S.targetRate,S.overrides);
  renderTree();
  renderResults();
  saveURL();
}

function filterBrowser(q){
  S.filter=q;
  renderBrowser();
}

function selectBrowserItem(id){
  S.browserItem=(S.browserItem===id?null:id);
  renderBrowser();
  // Also set target item in Mode 1 if item has a recipe
  if(S.mode==='target'&&id&&DEF_REC[id]){
    const sel=document.getElementById('target-item');
    if(sel){ sel.value=id; S.targetItem=id; }
  }
}

function doCalculate(){
  const sel=document.getElementById('target-item');
  const rate=document.getElementById('target-rate');
  S.targetItem=sel?sel.value:S.targetItem;
  S.targetRate=rate?+rate.value||60:S.targetRate;
  if(!S.targetItem) return;
  S.chain=resolveChain(S.targetItem,S.targetRate,S.overrides);
  renderTree();
  renderResults();
}

function setOverride(itemId,recipeId){
  S.overrides[itemId]=recipeId;
  if(S.targetItem){
    S.chain=resolveChain(S.targetItem,S.targetRate,S.overrides);
    renderTree();
    renderResults();
  }
}

// Mode 2 — factory management
function refreshFactoryLight(fid){
  const f=S.factories.find(f=>f.id===fid);
  const el=document.querySelector(`.factory-light[data-fid="${fid}"]`);
  if(!f||!el) return;
  let cls='dim';
  if(f.machines.length){
    const {net}=calcBuilder(f.machines);
    cls=Object.values(net).some(n=>n<-0.001)?'red':'green';
  }
  el.className=`factory-light ${cls}`;
}

function toggleResFactory(key){
  if(S.resCollapsed.has(key)) S.resCollapsed.delete(key);
  else S.resCollapsed.add(key);
  renderResults();
}

function toggleFactory(fid){
  if(S.collapsed.has(fid)) S.collapsed.delete(fid);
  else S.collapsed.add(fid);
  renderTree();
}

function addFactory(){
  const fid=S.nextFid++;
  S.factories.push({id:fid,name:'Factory '+fid,machines:[]});
  renderTree(); renderResults(); saveURL();
}

function duplicateFactory(fid){
  const src=S.factories.find(f=>f.id===fid);
  if(!src) return;
  const fid2=S.nextFid++;
  const copy={
    id:fid2,
    name:src.name+' (copy)',
    machines:src.machines.map(m=>({id:S.nextMid++,buildingId:m.buildingId,recipeId:m.recipeId,count:m.count}))
  };
  const idx=S.factories.indexOf(src);
  S.factories.splice(idx+1,0,copy);
  renderTree(); renderResults(); saveURL();
}

function removeFactory(fid){
  if(S.factories.length<=1) return;
  S.factories=S.factories.filter(f=>f.id!==fid);
  S.collapsed.delete(fid);
  S.resCollapsed.delete(fid);
  renderTree(); renderResults(); saveURL();
}

function renameFactory(fid,name){
  const f=S.factories.find(f=>f.id===fid);
  if(f){ f.name=name; saveURL(); }
}

// Mode 2 — machine management (all scoped to factory)
function addMachine(fid){
  const f=S.factories.find(f=>f.id===fid);
  if(f){ f.machines.push({id:S.nextMid++,buildingId:'manufacturer',recipeId:'',count:1}); renderTree(); renderResults(); saveURL(); }
}

function removeMachine(fid,mid){
  const f=S.factories.find(f=>f.id===fid);
  if(f){ f.machines=f.machines.filter(m=>m.id!==mid); renderTree(); renderResults(); saveURL(); }
}

function setBuildingId(fid,mid,bid){
  const f=S.factories.find(f=>f.id===fid);
  if(!f) return;
  const m=f.machines.find(m=>m.id===mid);
  if(!m) return;
  m.buildingId=bid;
  m.recipeId=''; // reset recipe when building changes
  renderTree(); renderResults(); saveURL();
}

function setMRecipe(fid,mid,rid){
  const f=S.factories.find(f=>f.id===fid);
  if(!f) return;
  const m=f.machines.find(m=>m.id===mid);
  if(m){ m.recipeId=rid; renderTree(); renderResults(); saveURL(); }
}

function setMCount(fid,mid,n){
  const f=S.factories.find(f=>f.id===fid);
  if(!f) return;
  const m=f.machines.find(m=>m.id===mid);
  if(m){ m.count=Math.max(0,n)||0; refreshFactoryLight(fid); renderResults(); saveURL(); }
}

// ════════════════════════════════════════════════════════
//  URL STATE  (hash-based so it works as a static file)
// ════════════════════════════════════════════════════════
function saveURL(){
  const p=new URLSearchParams();
  p.set('mode',S.mode);
  if(S.costMult!==1) p.set('cost',S.costMult);
  if(S.mode==='target'){
    if(S.targetItem) p.set('item',S.targetItem);
    p.set('rate',S.targetRate);
    const ov=Object.entries(S.overrides);
    if(ov.length) p.set('ov',ov.map(([k,v])=>k+'~'+v).join(','));
  } else {
    if(S.factories.some(f=>f.machines.length))
      p.set('f',S.factories.map(f=>
        encodeURIComponent(f.name)+'~'+f.machines.map(m=>[m.buildingId,m.recipeId,m.count].join('|')).join(';')
      ).join(','));
  }
  history.replaceState(null,'','#'+p.toString());
}

function loadURL(){
  const hash=location.hash.slice(1);
  if(!hash) return;
  const p=new URLSearchParams(hash);
  S.mode=p.get('mode')||'target';
  S.costMult=parseFloat(p.get('cost'))||1;
  if(S.mode==='target'){
    S.targetItem=p.get('item')||'';
    S.targetRate=parseFloat(p.get('rate'))||60;
    const ov=p.get('ov');
    if(ov) ov.split(',').forEach(pair=>{const[k,v]=pair.split('~');if(k&&v)S.overrides[k]=v;});
    if(S.targetItem) S.chain=resolveChain(S.targetItem,S.targetRate,S.overrides);
  } else {
    const fParam=p.get('f');
    const mParam=p.get('m'); // backward compat with old single-factory URLs
    if(fParam){
      S.factories=fParam.split(',').map(part=>{
        const tilde=part.indexOf('~');
        const name=decodeURIComponent(part.slice(0,tilde));
        const mStr=part.slice(tilde+1);
        const machines=mStr?mStr.split(';').filter(Boolean).map(seg=>{
          const[b,r,c]=seg.split('|');
          return{id:S.nextMid++,buildingId:b||'',recipeId:r||'',count:parseInt(c)||0};
        }):[];
        return{id:S.nextFid++,name,machines};
      });
    } else if(mParam){
      S.factories=[{id:S.nextFid++,name:'Factory 1',machines:mParam.split(',').map(part=>{
        const[b,r,c]=part.split('|');
        return{id:S.nextMid++,buildingId:b||'',recipeId:r||'',count:parseInt(c)||0};
      })}];
    }
  }
  // Sync mode buttons
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  const cm=document.getElementById('cost-mult'); if(cm) cm.value=S.costMult;
}

// ════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════
initData();
loadURL();
renderBrowser();
renderPlannerBar();
renderTree();
renderResults();
</script>
